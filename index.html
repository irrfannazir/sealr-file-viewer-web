<!DOCTYPE html>
<html>
<head>
<title>Redirecting...</title>
<script type="text/javascript">
  async function redirectBasedOnDevice() {
    const mobileBreakpoint = 768;
    const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
    console.log(viewportWidth)
    if(viewportWidth > mobileBreakpoint){
        window.location.href = "mobile.html"
    }else{
        window.location.href = "pc.html";
    }
  }

  // Call the function when the page loads
  window.onload = redirectBasedOnDevice;
</script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="index.html">click here for PC version</a> or <a href="indexm.html">click here for mobile version</a>.</p>
</body>
</html>
